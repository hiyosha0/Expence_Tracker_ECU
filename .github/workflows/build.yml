name: Build and verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Expence_Tracker_ECU.sln
      - run: dotnet build Expence_Tracker_ECU.sln -c Release -m:1 --no-restore
      - run: dotnet run --project Verification/Verification.csproj -c Release --no-build
